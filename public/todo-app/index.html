<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Todo App — Adarsh Kumar</title>
<link rel="icon" href="/assets/adarsh-a-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/adarsh-a-favicon.svg">
<link rel="stylesheet" href="/css/todo.css">
</head>
<body>
<main class="todo-shell">
  <a class="back" href="/projects/todo-app">← Back to project</a>
  <section class="app" aria-labelledby="todo-title">
    <header class="app-head">
      <div>
        <span class="eyebrow">TODO APP</span>
        <h1 id="todo-title">My Todo List</h1>
      </div>
      <div class="stats" aria-label="Task statistics">
        <div><b id="totalCount">0</b><span>Total</span></div>
        <div><b id="activeCount">0</b><span>Active</span></div>
        <div><b id="completedCount">0</b><span>Done</span></div>
      </div>
    </header>

    <form id="todoForm" class="composer" novalidate>
      <label class="sr-only" for="todoInput">Task</label>
      <input id="todoInput" maxlength="240" placeholder="Add a task…" autocomplete="off">
      <label class="sr-only" for="priorityInput">Priority</label>
      <select id="priorityInput">
        <option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option>
      </select>
      <label class="sr-only" for="categoryInput">Category</label>
      <input id="categoryInput" maxlength="32" placeholder="Category" autocomplete="off">
      <label class="sr-only" for="dueDateInput">Due date</label>
      <input id="dueDateInput" type="date" aria-label="Due date">
      <button class="add" type="submit">Add <span aria-hidden="true">↗</span></button>
    </form>

    <div class="toolbar">
      <label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Search tasks…" aria-label="Search tasks"></label>
      <div class="filters" role="group" aria-label="Task filter">
        <button type="button" class="active" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <label class="sort"><span>Sort</span><select id="sortSelect" aria-label="Sort tasks">
        <option value="created">Newest</option><option value="oldest">Oldest</option><option value="priority">Priority</option><option value="due">Due date</option><option value="alphabetical">A–Z</option>
      </select></label>
    </div>

    <div class="bulk"><button id="markAll" type="button">Mark all complete</button><button id="clearCompleted" type="button">Clear completed</button></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div id="emptyState" class="empty"><span>✓</span><strong>No tasks here</strong><small>Add a task to get started.</small></div>
    <ul id="todoList" aria-label="Tasks"></ul>
  </section>
</main>
<script src="/js/todo.js" defer></script>
</body>
</html>
