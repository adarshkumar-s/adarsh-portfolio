<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07080c"><title>Todo — Adarsh Kumar</title><link rel="icon" type="image/svg+xml" href="/assets/adarsh-a-favicon.svg"><link rel="stylesheet" href="/css/todo.css"></head><body><main class="todo-page"><a class="todo-back" href="/projects/todo-app">← Back to projects</a><section class="todo-shell" aria-labelledby="todo-title"><header class="todo-head"><div><span class="todo-kicker">TASK MANAGER</span><h1 id="todo-title">Todo</h1></div><div class="todo-stats" aria-label="Task statistics"><span><b id="totalCount">0</b>Total</span><span><b id="activeCount">0</b>Active</span><span><b id="completedCount">0</b>Done</span></div></header><form id="todoForm" class="todo-composer" novalidate><label class="sr-only" for="todoInput">Task</label><input id="todoInput" maxlength="240" placeholder="What needs to be done?" autocomplete="off" required><button class="primary" type="submit">Add task <span>↗</span></button></form><div class="todo-toolbar"><label class="todo-search"><span aria-hidden="true">⌕</span><span class="sr-only">Search tasks</span><input id="searchInput" type="search" placeholder="Search…" autocomplete="off"></label><div class="todo-filters" role="group" aria-label="Task filter"><button type="button" class="active" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="active" aria-pressed="false">Active</button><button type="button" data-filter="completed" aria-pressed="false">Completed</button></div><button id="clearCompleted" class="quiet" type="button">Clear completed</button></div><p id="todoNotice" class="todo-notice" role="status" aria-live="polite" hidden></p><div id="emptyState" class="todo-empty"><span>✓</span><strong>No tasks yet</strong><small>Add your first task above.</small></div><ul id="todoList" class="todo-list" aria-label="Tasks"></ul></section></main><script src="/js/todo.js" defer></script></body></html>
