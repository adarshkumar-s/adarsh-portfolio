<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Browser-based developer utilities."><title>Tools — Adarsh Kumar</title><link rel="stylesheet" href="/css/main.css"></head><body><div id="site-nav"></div><main class="shell"><header class="page-hero"><span class="eyebrow">TOOLS</span><h1>Useful utilities. No account. No upload.</h1><p>Everything runs locally in your browser. Input is not sent to a server.</p></header><section class="tool-grid"><article class="tool"><span class="tag">JSON</span><h2>Formatter</h2><textarea id="jsonIn" placeholder='{"hello":"world"}'></textarea><div class="tool-actions"><button class="small-button" data-action="format-json">Format</button><button class="small-button" data-action="minify-json">Minify</button></div><pre class="output" id="jsonOut"></pre></article><article class="tool"><span class="tag">ID</span><h2>UUID generator</h2><p>Generate UUIDs with the browser crypto API.</p><div class="tool-actions"><button class="small-button" data-action="uuid">Generate UUID</button><button class="small-button" data-copy="uuidOut">Copy</button></div><pre class="output" id="uuidOut"></pre></article><article class="tool"><span class="tag">SECURITY</span><h2>Password generator</h2><label for="passLen">Length</label><input id="passLen" type="number" min="8" max="128" value="20"><div class="tool-actions"><button class="small-button" data-action="password">Generate</button><button class="small-button" data-copy="passOut">Copy</button></div><pre class="output" id="passOut"></pre></article><article class="tool"><span class="tag">MARKDOWN</span><h2>Previewer</h2><textarea id="mdIn" placeholder="# Hello&#10;&#10;Write **Markdown** here."></textarea><div class="tool-actions"><button class="small-button" data-action="markdown">Preview</button></div><div class="output" id="mdOut"></div></article><article class="tool"><span class="tag">COLOR</span><h2>Color converter</h2><label for="hexIn">Hex</label><input id="hexIn" value="#B8FF5A" maxlength="7"><div class="tool-actions"><button class="small-button" data-action="color">Convert</button></div><pre class="output" id="colorOut"></pre><div class="swatch" id="swatch"></div></article><article class="tool"><span class="tag">TEXT</span><h2>Text analyzer</h2><textarea id="textIn" placeholder="Paste text here"></textarea><div class="tool-actions"><button class="small-button" data-action="textstats">Analyze</button></div><pre class="output" id="textOut"></pre></article></section></main><div id="site-footer"></div><script src="/js/site.js" defer></script><script src="/js/tools.js" defer></script></body></html>
