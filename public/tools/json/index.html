<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Local JSON formatter, validator and minifier by Adarsh Kumar."><title>JSON Formatter — Adarsh Kumar</title><link rel="icon" type="image/svg+xml" href="/assets/adarsh-a-favicon.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/labs-tools.css"></head>
<body><div id="site-nav"></div><main><header class="detail-hero shell"><span class="eyebrow">TOOL / DEVELOPER 01</span><h1>JSON <em>Formatter.</em></h1><p class="detail-lede">Validate, format and minify JSON without sending it anywhere. Your input stays in this browser tab.</p></header><section class="section shell"><div class="tool-panel tool-workspace"><div class="tool-toolbar"><button class="small-button primary" id="formatJson" type="button">Format</button><button class="small-button" id="validateJson" type="button">Validate</button><button class="small-button" id="minifyJson" type="button">Minify</button><button class="small-button" id="copyJson" type="button">Copy output</button><button class="small-button" id="clearJson" type="button">Clear</button></div><p class="tool-status" id="jsonStatus" role="status" aria-live="polite">Paste JSON to begin.</p><div class="json-grid"><div><label class="editor-label" for="jsonInput"><span>Input</span><span id="jsonInputMeta">0 chars · 0 lines</span></label><textarea class="editor" id="jsonInput" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder='{"project":"portfolio","active":true}'></textarea></div><div><label class="editor-label" for="jsonOutput"><span>Output</span><span id="jsonOutputMeta">0 chars · 0 lines</span></label><pre class="output-box" id="jsonOutput" tabindex="0" aria-label="Formatted JSON output"></pre></div></div><p class="tool-note">Processed locally with the browser's JSON parser. No JSON is uploaded.</p></div></section></main><div id="site-footer"></div><script src="/js/site.js" defer></script><script src="/js/tool-json.js" defer></script></body></html>
