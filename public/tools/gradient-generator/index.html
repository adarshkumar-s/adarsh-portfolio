<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Local CSS gradient generator for linear and radial gradients by Adarsh Kumar."><title>Gradient Generator — Adarsh Kumar</title><link rel="icon" type="image/svg+xml" href="/assets/adarsh-a-favicon.svg"><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/labs-tools.css"></head>
<body><div id="site-nav"></div><main><header class="detail-hero shell"><span class="eyebrow">TOOL / DESIGN 03</span><h1>Gradient <em>Generator.</em></h1><p class="detail-lede">Compose a linear or radial gradient, tune its direction and copy the CSS directly into your project.</p></header><section class="section shell"><div class="tool-panel tool-workspace gradient-workspace"><div class="gradient-preview" id="gradientPreview" aria-label="Live gradient preview"></div><div class="gradient-controls"><div class="control"><label for="colorA">Color A</label><input id="colorA" type="color" value="#a78bfa"></div><div class="control"><label for="colorB">Color B</label><input id="colorB" type="color" value="#68e8d0"></div><div class="control"><label for="gradientType">Type</label><select id="gradientType"><option value="linear">Linear</option><option value="radial">Radial</option></select></div><div class="control" id="angleControl"><label for="angle"><span>Angle</span><span id="angleValue">135°</span></label><input id="angle" type="range" min="0" max="360" value="135"></div></div><div class="tool-toolbar"><button class="small-button primary" id="copyCss" type="button">Copy CSS</button><button class="small-button" id="randomGradient" type="button">Randomize</button><button class="small-button" id="resetGradient" type="button">Reset</button></div><div class="css-output"><code id="cssOutput">background: linear-gradient(135deg, #a78bfa, #68e8d0);</code></div><p class="tool-status" id="gradientStatus" role="status" aria-live="polite">CSS updates as you change the controls.</p></div></section></main><div id="site-footer"></div><script src="/js/site.js" defer></script><script src="/js/tool-gradient.js" defer></script></body></html>
